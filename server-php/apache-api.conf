# Route http://localhost/api/* to the PHP backend (server-php/public)
# Include this from XAMPP's httpd.conf, e.g.:
#   Include "C:/xampps/htdocs/lainaaminen-projekti/server-php/apache-api.conf"
# Then restart Apache.

Alias /api "C:/xampps/htdocs/lainaaminen-projekti/server-php/public"

<Directory "C:/xampps/htdocs/lainaaminen-projekti/server-php/public">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
